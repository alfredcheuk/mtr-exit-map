<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  h1 { margin: 0; font-size: inherit; font-weight: inherit; }
  /* Set font-family on :root so html computes Inter, not browser default (Times on mac). */
  :root {
    font-family: "Inter", "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --bg: #ffffff;
    --fg: #111111;
    /* --muted: gray-500 (#6b7280) on white = 4.83:1, passes WCAG AA.
       gray-400 (#9ca3af) was 2.54:1, failed. */
    --muted: #6b7280;
    --hairline: #f0f0f0;
    --highlight: #fef3c7;
    --chip-text: #ffffff;
    --default-accent: #0073BD;
    /* --line-XXX vars are injected at runtime from data.json */
    --accent: var(--default-accent);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --fg: #f5f5f5;
      /* In dark mode #6b7280 on #0a0a0a is ~5:1 — passes AA. Same value, both modes. */
      --muted: #9ca3af;
      --hairline: #1f1f1f;
      --highlight: #42360e;
      --chip-text: #0a0a0a;
      --default-accent: #4FA8E0;
    }
  }
  body {
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    padding:
      calc(32px + env(safe-area-inset-top))
      calc(22px + env(safe-area-inset-right))
      calc(32px + env(safe-area-inset-bottom))
      calc(22px + env(safe-area-inset-left));
    position: relative;
  }
  .top-mark, .station-line-tag, .result-sub, .search-context {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .top-mark { letter-spacing: 0.14em; margin-bottom: 36px; }
  .line-tone { color: var(--accent); }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 12px;
    border-bottom: 1px solid var(--hairline);
    border-left: 0; border-right: 0; border-top: 0;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.01em;
    cursor: pointer;
    color: var(--fg);
    background: none;
    /* Extend horizontally with negative margin so the hover background reaches
       past the content edge — keeps text/chip in place but gives the hover box
       breathing room from row content. */
    width: calc(100% + 24px);
    margin-left: -12px;
    margin-right: -12px;
    text-align: left;
    font-family: inherit;
  }
  /* :last-child rather than :last-of-type — multi-line station rows render as
     <div> while single-line render as <button>, so :last-of-type matches per
     tag (not per class) and would drop the border on the last <div> row even
     when it isn't the visual last row. */
  .row:last-child { border-bottom: none; }
  .row:has(+ .search-trigger) { border-bottom: none; }
  .row:active { transform: scale(0.99); transition: transform 0.1s; }

  /* Hover states — only on devices with real hover (mouse/trackpad), not touch */
  @media (hover: hover) {
    .row:hover { background: color-mix(in srgb, var(--fg) 4%, transparent); }
    .chip:hover { filter: brightness(1.08); }
    .back-row:hover .back-arrow,
    .back-only:hover { color: var(--fg); }
    .search-trigger:hover { color: var(--fg); }
    .search-bar .cancel:hover { color: var(--fg); }
    .search-bar .clear-x:hover { color: var(--fg); }
  }
  .station-row .name { flex: 1; }
  /* Single-line station tag — matches chip visuals but is non-interactive
     (the parent row handles the click). */
  .station-row .line-tag {
    color: var(--chip-text);
    background: var(--default-accent);
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .station-row .chips { display: flex; gap: 6px; }
  .chip {
    color: var(--chip-text);
    background: var(--default-accent);
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    position: relative;
  }
  /* Invisible vertical hit-area expansion to reach 44px without changing visual size.
     Horizontal extension would overlap adjacent chips, so vertical only. */
  .chip::after {
    content: "";
    position: absolute;
    top: -11px; bottom: -11px;
    left: 0; right: 0;
  }
  .chip:active { transform: scale(0.95); transition: transform 0.1s; }
  .back-row {
    display: flex;
    align-items: center;
    gap: 10px;
    /* enlarged tap area: 14+22+14 = 50px tall, ≥44px ✓ */
    padding: 14px 0;
    margin-bottom: 14px;
    background: none;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    width: 100%;
    text-align: left;

    display: inline-block;
    flex-shrink: 0;

  .back-only {
    color: var(--accent);
    margin-bottom: 16px;
    background: none; border: 0;
    padding: 12px 12px 12px 0;
    margin-left: 0;

    line-height: 0;

    align-items: center;

  .back-only svg {
    width: 22px;
    height: 22px;

  .result-title {
    font-size: 40px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 8px;
  }
  .result-sub { margin-bottom: 32px; }
  .result-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 24px 0;
    border-bottom: 1px solid var(--hairline);
  }
  .result-row:last-of-type { border-bottom: none; }
  .result-row .dir {
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .result-row .action {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .result-row .car-hint {
    font-size: 17px;
    color: var(--muted);
    font-weight: 400;
    margin-left: 6px;
  }
  .search-trigger {
    position: fixed;
    bottom: 22px; right: 12px;
    /* enlarged tap area: 14+11+14 = 39 vertical → bumped to 16 to hit 43, plus glyph adds height */
    background: none; border: 0; padding: 16px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .search-trigger .glyph {
    font-size: 13px;
    margin-right: 6px;
    position: relative; top: 1px;
  }
  .search-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    border-bottom: 1px solid var(--fg);
    padding-bottom: 14px;
    margin-bottom: 18px;
  }
  .search-bar .glyph {
    color: var(--muted);
    font-size: 16px;
  }
  .search-bar input {
    flex: 1;
    border: 0;
    outline: 0;
    background: none;
    font-family: inherit;
    font-size: 18px;
    font-weight: 500;
    color: var(--fg);
    padding: 0;
    min-width: 0;
  }
  .search-bar .clear-x {
    color: var(--muted);
    font-size: 18px;
    background: none; border: 0;
    /* tap area: 12+18+12 = 42 vertical, 12+~16+12 = 40 horizontal — close to 44 */
    padding: 12px;
    margin: -12px 0;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
  }
  .search-bar .cancel {
    color: var(--accent);
    font-size: 14px;
    font-weight: 500;
    background: none; border: 0;
    padding: 14px 4px;
    margin: -14px -4px;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
  }
  .search-context { margin-bottom: 4px; }
  .match-hl {
    background: var(--highlight);
    color: var(--fg);
    padding: 0 1px;
  }
  .empty {
    padding: 40px 0;
    text-align: center;
    color: var(--muted);
    font-size: 15px;
  }
  .empty .hint {
    font-size: 12px;
    color: var(--muted);
    opacity: 0.65;
    margin-top: 8px;
  }
  .data-error {
    padding: 32px 0;
    color: #b45309;
    font-size: 13px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) {
    .data-error { color: #fbbf24; }
  }
  .data-error h3 {
    font-family: inherit;
    font-size: 15px;
    margin: 0 0 12px;
    color: var(--fg);
  }
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 180ms;
  }

  /* Keyboard focus styling — visible ring on tabbed elements only */
  :focus { outline: none; }
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* Honor user motion preferences */
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0ms;
    }
    .row:active, .chip:active {
      transform: none;
      transition: none;
    }
  }

  /* Customize screen */
  .top-mark-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 36px;
  }
  .top-mark-row .top-mark { margin-bottom: 0; }
  .gear {

    cursor: pointer;
    color: var(--muted);

  }
  .gear svg { width: 16px; height: 16px; display: block; }
  @media (hover: hover) {
    .gear:hover { color: var(--fg); }

  .customize-meta {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  .customize-meta .label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .customize-reset {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 0;
    cursor: pointer;
    font-family: inherit;
    padding: 12px 0 12px 12px;

  .customize-reset.confirm { color: #b45309; }
  @media (prefers-color-scheme: dark) {
    .customize-reset.confirm { color: #fbbf24; }
  }
  .customize-counts {
    font-size: 11px;
    font-weight: 600;

    text-transform: uppercase;

  }
  .customize-hint {

  }
  .customize-status {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;

    overflow: hidden;
    clip: rect(0 0 0 0);

  }
  .customize-section-label {
    font-size: 11px;
    font-weight: 600;

    margin-bottom: 4px;

  .customize-section-label:first-of-type { margin-top: 22px; }
  .customize-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 0;
    border-bottom: 1px solid var(--hairline);

  .customize-row:last-child { border-bottom: none; }
  .customize-row .name {

    font-size: 17px;

    letter-spacing: -0.01em;
  }

    border: 0;
    cursor: pointer;
    font-family: inherit;
    color: var(--fg);
    padding: 10px;
    margin: 0;
    line-height: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .customize-row button[aria-disabled="true"] {
    opacity: 0.3;
    cursor: default;
  }
  .customize-row .move svg { width: 16px; height: 16px; }
  .customize-row .fav svg { width: 20px; height: 20px; }
  .customize-row .fav { color: var(--fg); }
  .customize-divider {
    width: 1px;
    height: 18px;
    background: var(--hairline);
    flex-shrink: 0;
    margin: 0 2px;

  .customize-empty {
    padding: 24px 0;

    color: var(--muted);
    font-size: 14px;

</style>

<body>
<div id="app"><div class="top-mark" style="margin-top: 4px;">Loading…</div></div>
<script>
const state = {
  screen: 'stations',
  station: null,   // station name (string)
  line: null,      // line code (string)
  landmark: null,  // landmark name (string)
  searching: false,
  query: ''
};
let DATA = null;

// ---------- helpers ----------

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function hl(text, q) {
  if (!q) return escapeHtml(text);
  const lower = text.toLowerCase();
  const ql = q.toLowerCase();
  const idx = lower.indexOf(ql);
  if (idx === -1) return escapeHtml(text);
  return escapeHtml(text.slice(0, idx))
    + '<span class="match-hl">' + escapeHtml(text.slice(idx, idx + q.length)) + '</span>'
    + escapeHtml(text.slice(idx + q.length));
}

// ---------- prefs ----------

const PREFS_KEY = 'mtr-exit-prefs-v1';

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return null;
    const order = Array.isArray(parsed.order) ? parsed.order.filter(c => typeof c === 'string') : [];
    const excluded = Array.isArray(parsed.excluded) ? parsed.excluded.filter(c => typeof c === 'string') : [];
    return { order, excluded };
  } catch (e) {
    return null;
  }
}

function savePrefs(prefs) {
  try {
    localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
  } catch (e) {
    console.warn('Failed to save prefs:', e);
  }
}

function clearPrefs() {
  try {
    localStorage.removeItem(PREFS_KEY);
  } catch (e) {
    console.warn('Failed to clear prefs:', e);
  }
}

// Pure: returns the home-screen station list given source data + prefs.
function applyPrefs(stations, prefs) {
  if (!prefs) return stations;
  const byCode = new Map();
  stations.forEach(s => { if (s.code) byCode.set(s.code, s); });
  const excluded = new Set(prefs.excluded || []);
  const seen = new Set();
  const out = [];
  (prefs.order || []).forEach(code => {
    if (excluded.has(code)) return;
    if (seen.has(code)) return;
    const s = byCode.get(code);
    if (s) { out.push(s); seen.add(code); }
  });
  // Defensive: stations missing from both order & excluded shouldn't occur
  // (defaults push new stations to excluded), but guard for safety.
  stations.forEach(s => {
    if (!s.code) { out.push(s); return; }
    if (seen.has(s.code)) return;
    if (excluded.has(s.code)) return;
    out.push(s);
    seen.add(s.code);
  });
  return out;
}

// ---------- line config ----------

function lineName(code) {
  return (DATA && DATA.lines && DATA.lines[code] && DATA.lines[code].name) || code;
}

function lineDirections(code) {
  return (DATA && DATA.lines && DATA.lines[code] && DATA.lines[code].directions) || [];
}

function injectLineStyles() {
  const lines = (DATA && DATA.lines) || {};
  const codes = Object.keys(lines);
  function declsFor(mode) {
    return codes.map(code => {
      const c = lines[code].color;
      if (!c || typeof c !== 'object') return null;
      const v = c[mode] || c.light;
      return v ? '  --line-' + code + ': ' + v + ';' : null;
    }).filter(Boolean).join('\n');
  }
  const css =
    ':root {\n' + declsFor('light') + '\n}\n' +
    '@media (prefers-color-scheme: dark) {\n' +
    '  :root {\n' + declsFor('dark') + '\n  }\n' +
    '}';
  let style = document.getElementById('line-colors');
  if (!style) {
    style = document.createElement('style');
    style.id = 'line-colors';
    document.head.appendChild(style);
  }
  style.textContent = css;
}

function setAccentForLine(lineCode) {
  if (lineCode) {
    document.documentElement.style.setProperty('--accent', 'var(--line-' + lineCode + ')');
  } else {
    document.documentElement.style.setProperty('--accent', 'var(--default-accent)');
  }
}

// ---------- data lookups (nested-per-station) ----------

function getStation(name) {
  return DATA.stations.find(s => s.name === name);
}

function getLandmarksForStation(stationName) {
  const s = getStation(stationName);
  return s ? (s.landmarks || []).map(l => l.name) : [];
}

function normalizeBoard(b) {
  if (b == null) return null;
  if (typeof b === 'string') return { position: b, car_hint: null };
  return { position: b.position, car_hint: b.car_hint || null };
}

function getResultsFor(stationName, lineCode, landmarkName) {
  const station = getStation(stationName);
  if (!station) return null;
  const lm = (station.landmarks || []).find(l => l.name === landmarkName);
  if (!lm) return null;
  if (!lm.exit) {
    return { landmark: landmarkName, station: stationName, line: lineCode, exit: null, rows: [] };
  }
  const exitConfig = (station.exits || {})[lm.exit] || null;
  const boards = exitConfig && exitConfig.boards && exitConfig.boards[lineCode];
  const directions = lineDirections(lineCode);
  let rows = [];
  if (Array.isArray(boards)) {
    rows = boards.map((b, i) => {
      const norm = normalizeBoard(b);
      if (!norm) return null;
      return {
        direction: directions[i] || ('Direction ' + (i + 1)),
        position: norm.position,
        carHint: norm.car_hint
      };
    }).filter(Boolean);
  }
  return { landmark: landmarkName, station: stationName, line: lineCode, exit: lm.exit, rows };
}

// ---------- validation ----------

function validateData(d) {
  const errs = [];
  if (!d || typeof d !== 'object') { errs.push('data is not an object'); return errs; }
  if (!d.lines || typeof d.lines !== 'object') errs.push('missing or invalid `lines{}`');
  if (!Array.isArray(d.stations)) errs.push('missing or invalid `stations[]`');
  Object.entries(d.lines || {}).forEach(([code, cfg]) => {
    if (!cfg.name) errs.push('lines["' + code + '"] missing `name`');
    if (!cfg.color || typeof cfg.color !== 'object' || !cfg.color.light)
      errs.push('lines["' + code + '"] missing `color.{light,dark}`');
    if (!Array.isArray(cfg.directions) || cfg.directions.length === 0)
      errs.push('lines["' + code + '"] missing `directions[]`');
  });
  (d.stations || []).forEach((s, i) => {
    const at = 'stations[' + i + ']';
    if (!s.name) errs.push(at + ' missing `name`');
    (s.lines || []).forEach(line => {
      if (!d.lines || !d.lines[line]) errs.push(at + '.lines references undefined line "' + line + '"');
    });
    (s.landmarks || []).forEach((lm, j) => {
      const lat = at + '.landmarks[' + j + ']';
      if (!lm.name) errs.push(lat + ' missing `name`');
      if (lm.exit && !(s.exits || {})[lm.exit])
        errs.push(lat + ' references undefined exit "' + lm.exit + '"');
    });
    Object.entries(s.exits || {}).forEach(([code, exit]) => {
      const eat = at + '.exits["' + code + '"]';
      Object.entries((exit && exit.boards) || {}).forEach(([line, boards]) => {
        if (!d.lines || !d.lines[line]) {
          errs.push(eat + '.boards references undefined line "' + line + '"');
          return;
        }
        const expected = d.lines[line].directions.length;
        if (!Array.isArray(boards) || boards.length !== expected) {
          errs.push(eat + '.boards["' + line + '"] length ' +
            (Array.isArray(boards) ? boards.length : 'n/a') +
            ' must equal lines["' + line + '"].directions.length (' + expected + ')');
        }
      });
    });
  });
  return errs;
}

// ---------- nav ----------

function transitionTo(updates) {
  Object.assign(state, updates);
  syncUrl();
  if (document.startViewTransition) document.startViewTransition(render);
  else render();
}

function syncUrl() {
  const params = new URLSearchParams();
  if (state.screen === 'customize') {
    params.set('p', 'customize');
  } else {
    if (state.screen === 'landmarks' || state.screen === 'result') {
      params.set('s', state.station);
      params.set('l', state.line);
    }
    if (state.screen === 'result') params.set('lm', state.landmark);
  }
  const newUrl = params.toString() ? '?' + params : './';
  if (location.search !== ('?' + params)) {
    history.pushState(null, '', newUrl);
  }
}

function readUrl() {
  const params = new URLSearchParams(location.search);
  if (params.get('p') === 'customize') {
    return { screen: 'customize', station: null, line: null, landmark: null };
  }
  const s = params.get('s'), l = params.get('l'), lm = params.get('lm');
  if (lm && s && l) return { screen: 'result', station: s, line: l, landmark: lm };
  if (s && l) return { screen: 'landmarks', station: s, line: l, landmark: null };
  return { screen: 'stations', station: null, line: null, landmark: null };
}

function render() {
  setAccentForLine(state.line);

  app.innerHTML = '';

    if (state.screen === 'landmarks') return renderLandmarksSearch(app);

  if (state.screen === 'stations') return renderStations(app);
  if (state.screen === 'landmarks') return renderLandmarks(app);

function downArrowSvg() {

}
function starFilledSvg() {
  return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>';
}
function starOutlineSvg() {
  return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>';
}

function flipReorder(container, mutate) {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const before = new Map();
  if (!reduceMotion) {
    Array.from(container.querySelectorAll('.customize-row')).forEach(r => {
      before.set(r.dataset.code, r.getBoundingClientRect());
    });
  }
  mutate();
  if (reduceMotion) return;
  Array.from(container.querySelectorAll('.customize-row')).forEach(r => {
    const old = before.get(r.dataset.code);
    if (!old) return;
    const dy = old.top - r.getBoundingClientRect().top;
    if (!dy || !r.animate) return;
    r.animate(
      [{ transform: 'translateY(' + dy + 'px)' }, { transform: 'translateY(0)' }],
      { duration: 180, easing: 'ease-out' }
    );
  });
}

function renderCustomize(root) {
  const stations = DATA.stations;
  const codes = stations.map(s => s.code).filter(Boolean);
  const validCodes = new Set(codes);
  const byCode = new Map();
  stations.forEach(s => { if (s.code) byCode.set(s.code, s); });

  // Materialize working prefs from storage (defaults: all stations favorited).
  let prefs;
  const stored = loadPrefs();
  if (stored) {
    prefs = {
      order: stored.order.filter(c => validCodes.has(c)),
      excluded: stored.excluded.filter(c => validCodes.has(c))
    };
  } else {
    prefs = { order: codes.slice(), excluded: [] };
  }

  // Back row with screen title
  const back = document.createElement('button');
  back.className = 'back-row';
  back.setAttribute('aria-label', 'Back to stations');
  back.innerHTML = '<svg class="back-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="20" y1="12" x2="4" y2="12"/><polyline points="10 6 4 12 10 18"/></svg>' +
    '<span class="station-line-tag">FAVORITES · OTHER STATIONS</span>';
  back.onclick = () => transitionTo({ screen: 'stations', station: null, line: null, landmark: null, searching: false, query: '' });
  root.appendChild(back);

  // Counts + Reset row
  const meta = document.createElement('div');
  meta.className = 'customize-meta';
  const counts = document.createElement('span');
  counts.className = 'label';
  meta.appendChild(counts);
  const resetBtn = document.createElement('button');
  resetBtn.type = 'button';
  resetBtn.className = 'customize-reset';
  resetBtn.textContent = 'Reset';
  meta.appendChild(resetBtn);
  root.appendChild(meta);

  // 8-favorites hint
  const hint = document.createElement('div');
  hint.className = 'customize-hint';
  hint.textContent = 'Heads up: 8 is about all that fits comfortably on the home screen.';
  hint.hidden = true;
  root.appendChild(hint);

  // Live region (visually hidden)
  const status = document.createElement('div');
  status.className = 'customize-status';
  status.setAttribute('aria-live', 'polite');
  status.setAttribute('role', 'status');
  root.appendChild(status);

  // FAVORITES section
  const favLabelEl = document.createElement('div');
  favLabelEl.className = 'customize-section-label';
  favLabelEl.textContent = 'Favorites';
  root.appendChild(favLabelEl);
  const favList = document.createElement('div');
  favList.className = 'customize-favorites';
  root.appendChild(favList);

  // OTHER STATIONS section
  const otherLabelEl = document.createElement('div');
  otherLabelEl.className = 'customize-section-label';
  otherLabelEl.textContent = 'Other stations';
  root.appendChild(otherLabelEl);
  const otherList = document.createElement('div');
  otherList.className = 'customize-others';
  root.appendChild(otherList);

  let resetTimer = null;
  let resetArmed = false;

  function announce(msg) { status.textContent = msg; }
  function persist() { savePrefs(prefs); }
  function nameOf(code) { return (byCode.get(code) || { name: code }).name; }

  function buildFavRow(code) {
    const s = byCode.get(code);
    if (!s) return null;
    const row = document.createElement('div');
    row.className = 'customize-row';
    row.dataset.code = code;
    row.innerHTML =
      '<span class="name">' + escapeHtml(s.name) + '</span>' +
      '<button type="button" class="move move-up" aria-label="Move ' + escapeHtml(s.name) + ' up">' + upArrowSvg() + '</button>' +
      '<button type="button" class="move move-down" aria-label="Move ' + escapeHtml(s.name) + ' down">' + downArrowSvg() + '</button>' +
      '<span class="customize-divider" aria-hidden="true"></span>' +
      '<button type="button" class="fav" aria-pressed="true" aria-label="Unfavorite ' + escapeHtml(s.name) + '">' + starFilledSvg() + '</button>';
    row.querySelector('.move-up').onclick = () => moveUp(code);
    row.querySelector('.move-down').onclick = () => moveDown(code);
    row.querySelector('.fav').onclick = () => unfavorite(code);
    return row;
  }

  function buildOtherRow(code) {
    const s = byCode.get(code);
    if (!s) return null;
    const row = document.createElement('div');
    row.className = 'customize-row';
    row.dataset.code = code;
    row.innerHTML =
      '<span class="name">' + escapeHtml(s.name) + '</span>' +
      '<button type="button" class="fav" aria-pressed="false" aria-label="Favorite ' + escapeHtml(s.name) + '">' + starOutlineSvg() + '</button>';
    row.querySelector('.fav').onclick = () => favorite(code);
    return row;
  }

  function refreshFavArrows() {
    const rows = Array.from(favList.querySelectorAll('.customize-row'));
    rows.forEach((row, i) => {
      const up = row.querySelector('.move-up');
      const down = row.querySelector('.move-down');
      if (up) up.setAttribute('aria-disabled', i === 0 ? 'true' : 'false');
      if (down) down.setAttribute('aria-disabled', i === rows.length - 1 ? 'true' : 'false');
    });
  }

  function refreshMeta() {
    const f = prefs.order.length;
    const o = prefs.excluded.length;
    counts.textContent = f + ' ' + (f === 1 ? 'favorite' : 'favorites') + ' · ' +
      o + ' ' + (o === 1 ? 'other' : 'others');
    hint.hidden = f < 8;
  }

  function alphaSorted(codeList) {
    return codeList.slice().sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  }

  function renderFavorites() {
    favList.innerHTML = '';
    if (prefs.order.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'customize-empty';
      empty.textContent = 'No favorites.';
      favList.appendChild(empty);
      return;
    }
    prefs.order.forEach(code => {
      const row = buildFavRow(code);
      if (row) favList.appendChild(row);
    });
    refreshFavArrows();
  }

  function renderOthers() {
    otherList.innerHTML = '';
    const sorted = alphaSorted(prefs.excluded);
    if (sorted.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'customize-empty';
      empty.textContent = 'All stations favorited.';
      otherList.appendChild(empty);
      return;
    }
    sorted.forEach(code => {
      const row = buildOtherRow(code);
      if (row) otherList.appendChild(row);
    });
  }

  function moveUp(code) {
    const idx = prefs.order.indexOf(code);
    if (idx <= 0) return;
    flipReorder(favList, () => {
      const arr = prefs.order;
      [arr[idx - 1], arr[idx]] = [arr[idx], arr[idx - 1]];
      const moving = favList.querySelector('[data-code="' + code + '"]');
      const before = favList.querySelector('[data-code="' + arr[idx] + '"]');
      if (moving && before) favList.insertBefore(moving, before);
      refreshFavArrows();
    });
    persist();
    announce('Moved ' + nameOf(code) + ' up · position ' + idx + ' of ' + prefs.order.length);
  }

  function moveDown(code) {
    const idx = prefs.order.indexOf(code);
    if (idx === -1 || idx >= prefs.order.length - 1) return;
    flipReorder(favList, () => {
      const arr = prefs.order;
      [arr[idx], arr[idx + 1]] = [arr[idx + 1], arr[idx]];
      const moving = favList.querySelector('[data-code="' + code + '"]');
      const after = favList.querySelector('[data-code="' + arr[idx] + '"]');
      if (moving && after) favList.insertBefore(moving, after.nextSibling);
      refreshFavArrows();
    });
    persist();
    announce('Moved ' + nameOf(code) + ' down · position ' + (idx + 2) + ' of ' + prefs.order.length);
  }

  function unfavorite(code) {
    const idx = prefs.order.indexOf(code);
    if (idx === -1) return;
    prefs.order.splice(idx, 1);
    if (!prefs.excluded.includes(code)) prefs.excluded.push(code);
    persist();
    renderFavorites();
    renderOthers();
    refreshMeta();
    announce('Removed ' + nameOf(code) + ' from favorites');
  }

  function favorite(code) {
    const idx = prefs.excluded.indexOf(code);
    if (idx !== -1) prefs.excluded.splice(idx, 1);
    if (!prefs.order.includes(code)) prefs.order.push(code);
    persist();
    renderFavorites();
    renderOthers();
    refreshMeta();
    announce('Added ' + nameOf(code) + ' to favorites');
  }

  function disarmReset() {
    if (resetTimer) clearTimeout(resetTimer);
    resetTimer = null;
    resetArmed = false;
    resetBtn.classList.remove('confirm');
    resetBtn.removeAttribute('aria-pressed');
    resetBtn.textContent = 'Reset';
  }

  function armReset() {
    resetArmed = true;
    resetBtn.classList.add('confirm');
    resetBtn.setAttribute('aria-pressed', 'true');
    resetBtn.textContent = 'Tap again to confirm';
    resetTimer = setTimeout(disarmReset, 3000);
  }

  resetBtn.onclick = () => {
    if (!resetArmed) { armReset(); return; }
    if (resetTimer) clearTimeout(resetTimer);
    resetTimer = null;
    resetArmed = false;
    clearPrefs();
    prefs = { order: codes.slice(), excluded: [] };
    resetBtn.classList.remove('confirm');
    resetBtn.removeAttribute('aria-pressed');
    resetBtn.textContent = 'Reset';
    renderFavorites();
    renderOthers();
    refreshMeta();
    announce('Customizations reset');
  };

  renderFavorites();
  renderOthers();
  refreshMeta();
}

function makeSearchBar() {
  const bar = document.createElement('div');
  bar.className = 'search-bar';
  bar.innerHTML =
    '<span class="glyph" aria-hidden="true">⌕</span>' +
    '<input type="text" aria-label="Search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="' + escapeHtml(state.query) + '">' +
    '<button class="clear-x" type="button" aria-label="Clear search">×</button>' +
    '<button class="cancel" type="button">Cancel</button>';
  bar.querySelector('.clear-x').onclick = () => {
    state.query = '';
    const inp = bar.querySelector('input');
    inp.value = '';
    inp.dispatchEvent(new Event('input'));
    inp.focus();
  };
  bar.querySelector('.cancel').onclick = () => transitionTo({ searching: false, query: '' });
  return bar;
}

function renderStationsSearch(root) {
  const bar = makeSearchBar();
  root.appendChild(bar);
  const ctx = document.createElement('div');
  ctx.className = 'search-context';
  root.appendChild(ctx);
  const list = document.createElement('div');
  root.appendChild(list);
  function update() {
    const q = state.query;
    const matches = DATA.stations.filter(s => {
      if (s.name.toLowerCase().includes(q.toLowerCase())) return true;
      return s.lines.some(line => line.toLowerCase().includes(q.toLowerCase()));
    });
    ctx.textContent = 'Stations · ' + matches.length + ' ' + (matches.length === 1 ? 'match' : 'matches');
    list.innerHTML = '';
    if (matches.length === 0) {
      list.innerHTML = '<div class="empty">No stations match.<div class="hint">Try a partial name or line code.</div></div>';
    } else {
      matches.forEach(s => list.appendChild(stationTile(s, q)));
    }
  }
  bar.querySelector('input').addEventListener('input', (e) => {
    state.query = e.target.value;
    update();
  });
  update();
  setTimeout(() => bar.querySelector('input').focus(), 0);
}

function renderLandmarksSearch(root) {
  const bar = makeSearchBar();
  root.appendChild(bar);
  const ctx = document.createElement('div');
  ctx.className = 'search-context';
  root.appendChild(ctx);
  const list = document.createElement('div');
  root.appendChild(list);
  function update() {
    const q = state.query;
    const all = getLandmarksForStation(state.station);
    const matches = all.filter(l => l.toLowerCase().includes(q.toLowerCase()));
    ctx.innerHTML = escapeHtml(state.station.toUpperCase()) + ' · ' +
      lineToneInline(state.line, lineName(state.line).toUpperCase()) + ' · ' +
      matches.length + ' ' + (matches.length === 1 ? 'match' : 'matches');
    list.innerHTML = '';
    if (matches.length === 0) {
      list.innerHTML = '<div class="empty">No landmarks match.<div class="hint">Try a partial street, building, or shop name.</div></div>';
    } else {
      matches.forEach(l => list.appendChild(landmarkRow(l, q)));
    }
  }
  bar.querySelector('input').addEventListener('input', (e) => {
    state.query = e.target.value;
    update();
  });
  update();
  setTimeout(() => bar.querySelector('input').focus(), 0);
}

window.addEventListener('popstate', () => {
  Object.assign(state, { searching: false, query: '' }, readUrl());
  if (document.startViewTransition) document.startViewTransition(() => render());
  else render();
});

async function init() {
  try {
    DATA = await fetch('./data.json').then(r => r.json());
  } catch (e) {
    document.getElementById('app').innerHTML =
      '<div class="empty">Failed to load data.<div class="hint">Check that data.json is reachable.</div></div>';
    return;
  }
  const errs = validateData(DATA);
  if (errs.length) {
    document.getElementById('app').innerHTML =
      '<div class="data-error"><h3>data.json failed validation</h3>' +
      errs.map(e => '· ' + escapeHtml(e)).join('<br>') +
      '</div>';
    return;
  }
  injectLineStyles();
  Object.assign(state, readUrl());
  render();
}

if ('serviceWorker' in navigator) {
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloading) return;
    reloading = true;
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
  });
}

init();
</script>
</body>
</html>
